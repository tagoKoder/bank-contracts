name: Contracts CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "proto/**"
      - "gen/go/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/contracts-ci.yml"

  push:
    branches:
      - main
    paths:
      - "proto/**"
      - "gen/go/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/contracts-ci.yml"

permissions:
  contents: read

jobs:
  validate-contracts:
    name: Validate Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Install Go protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Buf lint
        run: buf lint

      - name: Check protobuf formatting
        run: buf format --diff --exit-code

      # TEMPORARILY DISABLED DURING BOOTSTRAP.
      #
      # After the initial contract cleanup is merged to main,
      # we will enable the breaking-change check here.

      - name: Generate Go contracts
        run: buf generate

      - name: Update Go module metadata
        run: go mod tidy

      - name: Verify generated code is committed
        run: git diff --exit-code -- gen/go go.mod go.sum

      - name: Compile generated Go contracts
        run: go test ./gen/go/...