name: Publish Java Contracts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish Java contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify release version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          POM_VERSION="$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)"

          echo "Tag: $TAG_VERSION"
          echo "POM: $POM_VERSION"

          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "Tag and pom.xml versions do not match"
            exit 1
          fi

      - name: Build Java contracts
        run: mvn --batch-mode clean verify

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}